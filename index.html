<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versatile AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <div class="w-full max-w-3xl flex flex-col h-[90vh] bg-slate-800 rounded-xl border border-slate-700 shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800">
      <h1 class="font-bold text-lg text-indigo-400">⚡ Versatile AI Assistant</h1>
      <button onclick="clearChat()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">Clear Chat</button>
    </div>

    <!-- Chat Container -->
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm">
      <div class="bg-slate-700/50 p-3 rounded-lg max-w-[85%] self-start text-slate-300">
        Hello! I can answer questions, review resumes, code, or generate text. What are we working on?
      </div>
    </div>

    <!-- Input Box -->
    <div class="p-4 border-t border-slate-700 bg-slate-800 flex gap-2">
      <textarea id="promptInput" rows="1" placeholder="Type a message or paste any text..." class="flex-1 p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500 resize-none"></textarea>
      <button onclick="sendMessage()" id="sendBtn" class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-white transition-all">Send</button>
    </div>
  </div>

  <script>
    let chatHistory = [];

    async function sendMessage() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      // Render User Message
      chatBox.innerHTML += `<div class="bg-indigo-600 text-white p-3 rounded-lg max-w-[85%] self-end ml-auto">${escapeHtml(text)}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Prepare payload
      chatHistory.push({ role: 'user', parts: [{ text }] });

      // Create Bot Bubble
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'bg-slate-700/50 text-slate-200 p-3 rounded-lg max-w-[85%] self-start whitespace-pre-wrap';
      chatBox.appendChild(botMsgDiv);

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatHistory })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);

          // Parse SSE Chunks
          const lines = chunk.split('\n');
          for (let line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const parsed = JSON.parse(line.replace('data: ', ''));
                const newText = parsed.candidates?.[0]?.content?.parts?.[0]?.text || '';
                fullResponse += newText;
                botMsgDiv.innerText = fullResponse;
                chatBox.scrollTop = chatBox.scrollHeight;
              } catch (e) {}
            }
          }
        }

        chatHistory.push({ role: 'model', parts: [{ text: fullResponse }] });

      } catch (err) {
        botMsgDiv.innerText = 'Error processing request.';
      }
    }

    function clearChat() {
      chatHistory = [];
      document.getElementById('chatBox').innerHTML = `<div class="bg-slate-700/50 p-3 rounded-lg max-w-[85%] self-start text-slate-300">Chat reset. Ask me anything!</div>`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
