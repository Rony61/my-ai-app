<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro AI Copywriter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-1 text-indigo-400">🚀 Pro AI Copywriter</h1>
    <p class="text-sm text-slate-400 text-center mb-6">Convert product features into high-converting marketing copy</p>

    <div class="mb-4">
      <label class="block text-xs font-semibold mb-1 text-slate-300">PRODUCT DETAILS & BENEFITS:</label>
      <textarea id="promptInput" rows="4" placeholder="e.g., Selling wireless noise-canceling headphones for $49 with 30-hour battery life..." class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
    </div>

    <button onclick="generateAIResponse()" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg transition-all text-white flex justify-center items-center gap-2">
      <span>Generate Marketing Copy</span>
    </button>

    <div class="mt-6">
      <label class="block text-xs font-semibold mb-1 text-slate-300">GENERATED CAMPAIGN COPY:</label>
      <div id="outputContainer" class="w-full min-h-[140px] p-4 rounded-lg bg-slate-900 border border-slate-700 text-sm whitespace-pre-wrap text-slate-200">
        <em>Your generated campaign ad will appear here...</em>
      </div>
    </div>
  </div>

  <script>
    async function generateAIResponse() {
      const prompt = document.getElementById('promptInput').value.trim();
      const output = document.getElementById('outputContainer');
      const btn = document.getElementById('submitBtn');

      if (!prompt) {
        alert('Please enter product details first.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Crafting Copy...';
      output.innerText = 'Analyzing product parameters...';

      const systemInstruction = "You are a world-class direct-response copywriter. Transform the user's raw product notes into 1 Facebook Ad, 1 High-Converting Email Subject Line, and 3 Bulleted Selling Points. Keep the tone persuasive and crisp.";

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, systemInstruction })
        });

        const data = await response.json();

        if (data.text) {
          output.innerText = data.text;
        } else {
          output.innerText = `Error: ${data.error}`;
        }
      } catch (error) {
        output.innerText = `Network Error: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Generate Marketing Copy';
      }
    }
  </script>
</body>
</html>
