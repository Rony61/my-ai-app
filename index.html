<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Zero-Cost AI Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">⚡ My Free AI Platform</h1>
    <p class="text-sm text-slate-400 text-center mb-6">Powered by Gemini 3.6 Flash</p>

    <!-- API Key Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold mb-1 text-slate-300">ENTER YOUR GEMINI API KEY:</label>
      <input type="password" id="apiKey" placeholder="Paste your AIzaSy... key here" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500">
    </div>

    <!-- User Prompt Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold mb-1 text-slate-300">YOUR PROMPT:</label>
      <textarea id="promptInput" rows="3" placeholder="Ask anything... (e.g., Write a short business plan for a local agency)" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
    </div>

    <!-- Submit Button -->
    <button onclick="generateAIResponse()" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg transition-all text-white flex justify-center items-center gap-2">
      <span>Generate Response</span>
    </button>

    <!-- Response Display -->
    <div class="mt-6">
      <label class="block text-xs font-semibold mb-1 text-slate-300">AI OUTPUT:</label>
      <div id="outputContainer" class="w-full min-h-[120px] p-4 rounded-lg bg-slate-900 border border-slate-700 text-sm whitespace-pre-wrap text-slate-200">
        <em>Your AI response will appear here...</em>
      </div>
    </div>
  </div>

  <script>
    async function generateAIResponse() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('promptInput').value.trim();
      const output = document.getElementById('outputContainer');
      const btn = document.getElementById('submitBtn');

      if (!apiKey) {
        alert('Please paste your Gemini API key!');
        return;
      }
      if (!prompt) {
        alert('Please enter a prompt first.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Generating...';
      output.innerText = 'Thinking...';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          output.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          output.innerText = `API Error: ${data.error.message}`;
        } else {
          output.innerText = 'Failed to get a response. Please check your key.';
        }
      } catch (error) {
        output.innerText = `Network Error: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Generate Response';
      }
    }
  </script>
</body>
</html>
